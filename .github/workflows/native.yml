name: Native desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKit / GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build backend + native host (Linux)
        run: |
          cargo build --release
          cargo build --release --manifest-path native-host/Cargo.toml
      - name: Stage portable layout
        run: |
          VER=$(node -p "require('./package.json').version")
          OUT="dist/XMath_v${VER}_linux_x64"
          mkdir -p "$OUT/backend" "$OUT/build"
          cp native-host/target/release/xmath-native "$OUT/XMath"
          cp target/release/xmath "$OUT/backend/xmath"
          chmod +x "$OUT/XMath" "$OUT/backend/xmath"
          cp -R static "$OUT/static"
          if [ -f build/icon.png ]; then cp build/icon.png "$OUT/build/icon.png"; fi
          (cd dist && tar -czf "XMath_v${VER}_linux_x64.tar.gz" "XMath_v${VER}_linux_x64")
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMath-linux
          path: dist/*_linux_*.tar.gz
